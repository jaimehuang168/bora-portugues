<script>

window.BORA_CONTENT = {
  lessons: [
    {id:'hello',level:'A1',track:'life',title:'從一句 Oi 開始',subtitle:'打招呼與基本禮貌',icon:'sun',tag:'初次見面',tip:'先把短句說自然，不必急著背長句。Obrigado / obrigada 隨說話者的語法性別選用。',phrases:[
      ['Oi, tudo bem?','嗨，你好嗎？','Hola, ¿todo bien?','Oi 是常見的非正式招呼；正式場合可用 Olá。'],
      ['Tudo bem, e você?','很好，你呢？','Todo bien, ¿y tú?','você 後面使用第三人稱單數動詞形式。'],
      ['Bom dia!','早安！','¡Buenos días!','dia 是陽性名詞，所以是 bom dia。'],
      ['Boa tarde!','午安！','¡Buenas tardes!','tarde 是陰性名詞，所以是 boa tarde。'],
      ['Boa noite!','晚安！／晚上好！','¡Buenas noches!','晚上見面與道別都能使用，依情境理解。'],
      ['Obrigado pela ajuda.','謝謝你的幫忙。','Gracias por la ayuda.','本句採男性說話者形式；女性說話者可說 Obrigada pela ajuda。']
    ]},
    {id:'intro',level:'A1',track:'life',title:'介紹你自己',subtitle:'姓名、生活與工作',icon:'user',tag:'自我介紹',tip:'以 Sou（我是）、Moro（我住）、Trabalho（我工作）組合一段自己的介紹。',phrases:[
      ['Meu nome é Jaime.','我的名字是 Jaime。','Me llamo Jaime.','可以把 Jaime 換成自己的名字。'],
      ['Sou de Taiwan.','我來自台灣。','Soy de Taiwán.','sou 是 ser 的第一人稱單數。'],
      ['Moro no Paraguai.','我住在巴拉圭。','Vivo en Paraguay.','no = em + o；此處是 no Paraguai。'],
      ['Trabalho em um parque tecnológico.','我在一個科技園區工作。','Trabajo en un parque tecnológico.','trabalho 是 trabalhar 的第一人稱單數。'],
      ['Estou aprendendo português.','我正在學葡萄牙文。','Estoy aprendiendo portugués.','estar + 動名詞可表達正在進行的動作。'],
      ['Você fala espanhol?','你會說西班牙文嗎？','¿Hablas español?','不要把 espanhol 和 português 的拼字混用。']
    ]},
    {id:'cafe',level:'A1',track:'life',title:'點一杯巴西日常',subtitle:'咖啡、餐廳與結帳',icon:'coffee',tag:'餐飲',tip:'gostaria de 是實用的禮貌請求句型，後面加你想要的東西。',phrases:[
      ['Eu gostaria de um café, por favor.','我想要一杯咖啡，謝謝。','Quisiera un café, por favor.','gostaria de 比直接說 quero 更委婉。'],
      ['Sem açúcar, por favor.','請不要加糖。','Sin azúcar, por favor.','sem 表示「沒有／不加」。'],
      ['Você tem água sem gás?','你們有無氣泡的水嗎？','¿Tienen agua sin gas?','água com gás 是氣泡水。'],
      ['Pode trazer o cardápio?','可以拿菜單給我嗎？','¿Puede traerme el menú?','cardápio 是菜單。'],
      ['A conta, por favor.','請結帳。','La cuenta, por favor.','conta 在此指帳單。'],
      ['Estava muito bom, obrigado.','很好吃，謝謝。','Estaba muy rico, gracias.','此處 bom 泛指餐點很好；說話者可依需要用 obrigada。']
    ]},
    {id:'shopping',level:'A1',track:'life',title:'買東西，不再靠猜',subtitle:'價格、付款與收據',icon:'bag',tag:'購物',tip:'先掌握 Quanto custa?，再加上付款方式。這是語言練習，不代表任何支付服務保證可用。',phrases:[
      ['Quanto custa?','多少錢？','¿Cuánto cuesta?','複數商品可問 Quanto custam?'],
      ['Posso pagar com cartão?','我可以用卡付款嗎？','¿Puedo pagar con tarjeta?','posso 是 poder 的第一人稱單數。'],
      ['Vou pagar em dinheiro.','我要付現金。','Voy a pagar en efectivo.','em dinheiro 表示以現金支付。'],
      ['Você tem uma sacola?','你有袋子嗎？','¿Tienes una bolsa?','sacola 是購物袋。'],
      ['Pode emitir a nota fiscal?','可以開發票嗎？','¿Puede emitir la factura?','這裡只練習請求表達，不說明開票規範。'],
      ['Só estou olhando, obrigado.','我只是看看，謝謝。','Solo estoy mirando, gracias.','在商店可用來禮貌回應店員。']
    ]},
    {id:'directions',level:'A2',track:'life',title:'跨境出門更自在',subtitle:'問路、交通與接送',icon:'map',tag:'跨境生活',tip:'把目的地換成 centro、aeroporto 或 entrada，練習同一句型的變化。',phrases:[
      ['Onde fica o banheiro?','洗手間在哪裡？','¿Dónde está el baño?','巴西常用 banheiro 表示洗手間。'],
      ['Como eu chego ao centro?','我要怎麼到市中心？','¿Cómo llego al centro?','ao = a + o。'],
      ['Pode me deixar na entrada?','可以讓我在入口下車嗎？','¿Puede dejarme en la entrada?','搭車時 deixar 可表達讓人下車。'],
      ['Preciso ir ao aeroporto.','我需要去機場。','Necesito ir al aeropuerto.','precisar + 不定詞：preciso ir。'],
      ['Quanto tempo leva?','要花多久？','¿Cuánto tiempo se tarda?','可用於交通、作業或辦事時間。'],

  grammar: [
    {id:'ser-estar',title:'ser 與 estar：不要只背「永久／暫時」',level:'A1',summary:'ser 常用於身分、來源與特徵；estar 常用於狀態與人或物的位置。這只是入門框架，事件地點等用法另有規則。',examples:[['Sou de Taiwan.','我來自台灣。','Soy de Taiwán.'],['Estou no escritório.','我在辦公室。','Estoy en la oficina.']],question:'「我現在在辦公室」應選哪句？',options:['Sou no escritório.','Estou no escritório.','Tenho no escritório.'],answer:1,explain:'描述自己目前所在位置，用 estou（estar），不是 sou。'},
    {id:'voce',title:'você 的動詞，不照西班牙文 tú 套',level:'A1',summary:'você 指「你」，動詞使用第三人稱單數；vocês 指「你們」，使用第三人稱複數。',examples:[['Você fala português?','你會說葡語嗎？','¿Hablas portugués?'],['Vocês falam português?','你們會說葡語嗎？','¿Hablan portugués?']],question:'把「你們會說葡語嗎？」補完整：Vocês ___ português?',options:['fala','falo','falam'],answer:2,explain:'vocês 是複數，搭配 falam；você 則搭配 fala。'},
    {id:'gostar',title:'gostar de：別忘了 de',level:'A1',summary:'gostar 表達喜歡時，通常連接 de + 名詞或不定詞；gostaria de 可用於較委婉的請求。',examples:[['Gosto de café.','我喜歡咖啡。','Me gusta el café.'],['Gostaria de marcar uma reunião.','我想安排一場會議。','Quisiera programar una reunión.']],question:'哪一句是「我喜歡咖啡」？',options:['Gosto de café.','Gosto café.','Me gosto café.'],answer:0,explain:'葡語用 Gosto de café，不直接套用西班牙文 Me gusta 的結構。'},
    {id:'contractions',title:'no、na、do、da 是怎麼來的？',level:'A1',summary:'em + o = no；em + a = na；de + o = do；de + a = da。縮合後仍要留意名詞的性別與數。',examples:[['Trabalho no Paraguai.','我在巴拉圭工作。','Trabajo en Paraguay.'],['O nome da empresa.','公司的名稱。','El nombre de la empresa.']],question:'「公司的名稱」：O nome ___ empresa.',options:['do','da','no'],answer:1,explain:'empresa 是陰性名詞，de + a 縮合為 da。'},

    {id:'need',title:'precisar：接名詞與動詞不一樣',level:'A2',summary:'precisar de + 名詞：需要某物。precisar + 不定詞：需要做某事。',examples:[['Precisamos de mais informações.','我們需要更多資訊。','Necesitamos más información.'],['Precisamos confirmar a reunião.','我們需要確認會議。','Necesitamos confirmar la reunión.']],question:'「我需要一份報價」應選哪句？',options:['Preciso um orçamento.','Preciso de um orçamento.','Preciso para um orçamento.'],answer:1,explain:'本課採標準教學形式：precisar de + 名詞，所以用 de um orçamento。'},
    {id:'por-para',title:'por 與 para：先掌握常用搭配',level:'B1',summary:'這裡只練三種用途：por 表傳遞方式；para 表目的或接收者。兩個介詞還有其他用法，不是一對一翻譯。',examples:[['Envio a proposta por e-mail.','我用電子郵件寄提案。','Envío la propuesta por correo electrónico.'],['A proposta é para a sua empresa.','這份提案是給貴公司的。','La propuesta es para su empresa.']],question:'「用電子郵件傳送」：Enviar ___ e-mail.',options:['para','por','de'],answer:1,explain:'這裡表達傳遞方式，固定練習用 por e-mail。'},

<script>
/* Pure plan model. No DOM, network, analytics or credentials. */
(() => {
'use strict';
const P=window.BORA_PLAN;
const obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const text=(v,n=2000)=>typeof v==='string'?v.slice(0,n):'';
const num=(v,a,b,d=0)=>typeof v==='number'&&Number.isFinite(v)?Math.min(b,Math.max(a,Math.floor(v))):d;
const key=d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
function date(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const d=new Date(s+'T12:00:00Z');return Number.isFinite(+d)&&key(d)===s&&d.getUTCFullYear()>=1900&&d.getUTCFullYear()<=2200?d:null;}
function addMonths(s,n){const d=date(s);if(!d)return '';const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return key(d);}
function shift(s,n){const d=date(s);if(!d)return '';d.setUTCDate(d.getUTCDate()+n);return key(d);}
function schedule(start,today){if(!date(start)||!date(today))return {month:1,phase:1,started:false,finished:false,planned:false};if(today<start)return {month:1,phase:1,started:false,finished:false,planned:true};if(today>=addMonths(start,18))return {month:18,phase:3,started:true,finished:true,planned:true};let m=1;while(m<18&&today>=addMonths(start,m))m++;return {month:m,phase:m<=3?1:m<=9?2:3,started:true,finished:false,planned:true};}
function week(s){const d=date(s);if(!d)return ['', ''];const wd=d.getUTCDay();const from=shift(s,-((wd+6)%7));return [from,shift(from,6)];}
function defaults(){return {startDate:'',teacher:{name:'',contact:'',mode:'線上或面對面',notes:''},milestones:{},logs:[],visits:[],works:[]};}
function list(v,max){if(v===undefined)return [];if(!Array.isArray(v)||v.length>max)throw Error('計畫紀錄格式或筆數超出上限。');return v;}
function cleanId(v){return typeof v==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(v)?v:'';}
function unique(items){const seen=new Set();for(const x of items){if(!x.id||seen.has(x.id))throw Error('計畫紀錄有無效或重複的識別碼。');seen.add(x.id);}return items;}
function validate(raw){
 const d=defaults();if(raw===undefined)return d;if(!obj(raw))throw Error('18 個月計畫資料格式錯誤。');
 d.startDate=date(raw.startDate)?raw.startDate:'';
 if(obj(raw.teacher))d.teacher={name:text(raw.teacher.name,100),contact:text(raw.teacher.contact,200),mode:['線上或面對面','面對面','線上'].includes(raw.teacher.mode)?raw.teacher.mode:'線上或面對面',notes:text(raw.teacher.notes,1500)};
 if(obj(raw.milestones))for(const m of P.months){const r=raw.milestones[m.n];if(!obj(r))continue;const checks=m.tasks.map((_,i)=>r.checks?.[i]===true),evidence=text(r.evidence,3000),reviewer=text(r.reviewer,100);let status=['working','self','teacher'].includes(r.status)?r.status:'working';if(!checks.every(Boolean)||!evidence.trim())status='working';if(status==='teacher'&&!reviewer.trim())status='self';d.milestones[m.n]={checks,evidence,reviewer,status,at:date(r.at)?r.at:''};}
 d.logs=unique(list(raw.logs,2500).map(r=>{if(!obj(r)||!date(r.date)||!['listen','teacher','reading','writing','rehearsal'].includes(r.kind))throw Error('學習紀錄欄位無效。');return {id:cleanId(r.id),date:r.date,kind:r.kind,minutes:num(r.minutes,1,480,1),title:text(r.title,200),url:safeURL(r.url),words:text(r.words,500),notes:text(r.notes,3000)};}));
 d.visits=unique(list(raw.visits,120).map(r=>{if(!obj(r)||!date(r.date)||!P.industries.some(i=>i.id===r.industry)||!Array.isArray(r.lines)||r.lines.length!==10)throw Error('訪客十句資料不完整。');return {id:cleanId(r.id),company:text(r.company,150),date:r.date,industry:r.industry,purpose:text(r.purpose,1500),lines:r.lines.map(x=>({pt:text(x?.pt,800),zh:text(x?.zh,800),practiced:x?.practiced===true})),unknown:text(r.unknown,3000),correction:text(r.correction,3000),next:text(r.next,1500)};}));
 d.works=unique(list(raw.works,120).map(r=>{if(!obj(r)||!P.templates.some(t=>t.id===r.type))throw Error('專業作品格式無效。');return {id:cleanId(r.id),type:r.type,title:text(r.title,160),text:text(r.text,18000),revised:text(r.revised,18000),notes:text(r.notes,3000),reviewer:text(r.reviewer,100),status:['draft','review','revised','rehearsed'].includes(r.status)?r.status:'draft',updated:date(r.updated)?r.updated:'',reps:num(r.reps,0,10000)};}));
 return d;
}
function safeURL(s){try{const u=new URL(text(s,2000));return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function uid(){return 'r_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);}
window.BoraPlanModel={date,key,shift,addMonths,schedule,week,defaults,validate,safeURL,uid};
})();

</script>
<script>

window.BoraPlanUI = {create(E){
'use strict';
const P=window.BORA_PLAN,M=window.BoraPlanModel,h=E.esc,ic=E.icon;
const $=s=>document.querySelector(s),plan=()=>E.getState().plan,today=E.dateKey;

const statuses={working:'練習中',self:'已自評完成',teacher:'老師已確認（自行登錄）'};
const workStatuses={draft:'草稿',review:'待老師修訂',revised:'老師已修訂（自行登錄）',rehearsed:'已演練'};
let selectedMonth=null,selectedVisit='',selectedWork='',editLog='',journalKind='listen';

function weekCount(){const [a,b]=M.week(today());return plan().logs.filter(l=>l.kind==='teacher'&&l.date>=a&&l.date<=b).length;}

function field(id,label,value='',type='text',extra=''){return `<div class="form-field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${h(value)}" ${extra}></div>`;}
function area(id,label,value='',extra=''){return `<div class="form-field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" rows="4" ${extra}>${h(value)}</textarea></div>`;}
function btn(action,label,extra='',style='secondary'){return `<button type="button" class="btn ${style} small" data-action="${action}" ${extra}>${label}</button>`;}
function goto(tab,label,style='secondary'){return btn('plan-tab',label,`data-tab="${tab}"`,style);}
function page(tab='roadmap'){
 if(!['roadmap','journal','visits','works'].includes(tab))tab='roadmap';

}
function banner(){const s=sched(),p=phase(s.month);return `<section class="plan-home-banner"><div class="row gap8"><span class="pill gold">18 個月專屬計畫</span><span class="small">${s.started?`第 ${s.month} 個月 · ${p.name}`:s.planned?`預定 ${h(plan().startDate)} 開始`:'設定你的起始日'}</span></div><div class="row between wrap mt12"><div><h2>從寒暄，到主持招商會議。</h2><p>今日聽力 <b>${sum('listen',today())} / 30</b> 分鐘 · 本週老師課 <b>${weekCount()}</b> 堂 · 階段確認 <b>${verified()} / 3</b></p></div>${goto('roadmap','開啟 18 個月路線 '+ic('arrow'),'white')}</div></section>`;}
function roadmap(){
 const s=sched(),n=selectedMonth||s.month,m=P.months[n-1],p=phase(n),r=plan().milestones[n]||{checks:[],status:'working',evidence:'',reviewer:''};
 const a=plan().startDate?M.addMonths(plan().startDate,n-1):'',b=a?M.shift(M.addMonths(plan().startDate,n),-1):'';
 return `<section class="panel plan-start"><div><span class="kicker">YOUR STARTING POINT</span><h2>${s.started?(s.finished?'18 個月已走完，仍可回頭練習。':`目前排程：第 ${s.month} 個月 · ${phase(s.month).name}`):s.planned?'起始日已設定，先預覽路線。':'先設定起始日，不預填學習成績。'}</h2><p class="small muted mt8">月份從起始日計算，不是曆月。日期前進不代表能力通過，所有教材都可提前練習。</p></div><form id="plan-start-form">${field('plan-start-date','計畫起始日',plan().startDate||today(),'date','required min="1900-01-01" max="2200-01-01"')}<button type="submit" class="btn small">${plan().startDate?'更新起始日':'開始我的計畫'}</button></form></section>

function journal(){
 const s=sched(),w=M.week(today()),l=plan().logs.find(x=>x.id===editLog),kind=l?.kind||journalKind,t=plan().teacher;

 <div class="plan-grid"><section class="panel"><div class="section-heading"><h2>${l?'編輯學習紀錄':'記錄一次學習'}</h2>${l?btn('plan-log-cancel','取消編輯'):''}</div><p class="small muted mb16">外部播放器不會自動回報播放時間。請實際聽完或上完課再登錄；App 不代為預約老師。</p><form id="plan-log-form" data-id="${h(l?.id||'')}"><div class="plan-two"><div class="form-field"><label for="log-kind">類型</label><select id="log-kind" name="log-kind">${options(kinds,kind)}</select></div>${field('log-date','完成日期',l?.date||today(),'date',`required max="${today()}"`)}</div><div class="plan-two">${field('log-title','標題／老師／主題',l?.title||'','text','required maxlength="200" placeholder="例如：產業 podcast；老師姓名"')}${field('log-minutes','實際分鐘',l?.minutes||(kind==='listen'?30:60),'number','required min="1" max="480" step="1"')}</div>${field('log-url','音訊或文章連結（可留白）',l?.url||'','url','maxlength="2000" placeholder="https://…"')}${area('log-words','聽懂的關鍵字／老師修正的詞',l?.words||'','maxlength="500" placeholder="三個關鍵字就好；也可填發音重點。"')}${area('log-notes','沒聽懂的地方／下次要練什麼',l?.notes||'','maxlength="3000" placeholder="例如：第 02:35 段、沒聽清楚的數字、老師的建議。"')}<button type="submit" class="btn">${ic('check')}${l?'儲存修改':'加入紀錄'}</button></form></section>
 <aside class="stack"><section class="panel"><h2>30 分鐘，怎麼聽</h2><div class="listening-steps"><div><b>10′</b><p><strong>先抓大意</strong><span>選短篇商業／產業音訊，可重複；不要求初期聽懂全部。</span></p></div><div><b>10′</b><p><strong>同一段，再聽一次</strong><span>找三個關鍵字，特別注意數字、時間與需求。</span></p></div><div><b>10′</b><p><strong>逐段聽，再跟讀</strong><span>重播短句，模仿停頓；把不懂的內容留給老師。</span></p></div></div><div class="note mt16">這是建議分配。通勤時只聽，不操作螢幕、不記筆記；停妥或抵達後再補記錄。</div></section>
 <section class="panel"><h2>老師與課程安排</h2><p class="small muted mt8">Foz 當地或線上老師皆可；此處不連接訂課服務。</p><form id="plan-teacher-form" class="mt16">${field('teacher-name','老師姓名',t.name,'text','maxlength="100"')}${field('teacher-contact','聯絡方式／個人備註',t.contact,'text','maxlength="200"')}<div class="form-field"><label for="teacher-mode">上課方式</label><select id="teacher-mode" name="teacher-mode">${['線上或面對面','面對面','線上'].map(x=>`<option${selected(t.mode,x)}>${x}</option>`).join('')}</select></div>${area('teacher-notes','每週時段／想請老師幫忙的事',t.notes,'maxlength="1500" placeholder="第 1–3 月每週兩堂：一堂發音聽力，一堂接待情境。時段由你與老師確認。"')}<button type="submit" class="btn secondary small">儲存老師資料</button></form></section></aside></div>

 <section class="panel mt24"><h2>外部閱讀與音訊入口</h2><p class="small muted mt8">只提供連結，不嵌入、不下載、不複製文章全文。以下入口於 2026-09-20 查核；內容與可用性由原站提供。</p><div class="plan-two mt16">${P.resources.map(x=>`<article class="resource-card"><span class="pill neutral">${h(x.kind)}</span><h3 class="mt12">${h(x.name)}</h3><p class="small muted mt8">${h(x.note)}</p><a class="text-btn" href="${h(x.url)}" target="_blank" rel="noopener noreferrer">開啟來源 ↗</a></article>`).join('')}</div></section>`;

function wordCount(text){return (String(text).match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]).length;}
function val(f,k){return String(new FormData(f).get(k)||'').trim();}
function requireDate(s,allowFuture=true){if(!M.date(s)||(!allowFuture&&s>today()))throw Error(allowFuture?'請填寫有效日期。':'完成日期不可晚於今天。');}
function escapeFile(s){return String(s).replace(/[\\/:*?"<>|\r\n]/g,'_').slice(0,70)||'note';}
function download(name,body){E.downloadFile(name,body,'text/plain;charset=utf-8');E.toast('已產生文字檔，請確認下載項目。');}
function submit(event){const f=event.target;if(!f.id?.startsWith('plan-'))return;event.preventDefault();try{
 switch(f.id){
 case 'plan-start-form':{const date=val(f,'plan-start-date');requireDate(date);if(plan().startDate&&plan().startDate!==date&&!confirm('變更起始日會重新計算月份日期，但不刪除紀錄或驗收。繼續嗎？'))return;plan().startDate=date;selectedMonth=null;commit('起始日已更新；既有成果不受影響。');E.render();break;}
 case 'plan-milestone-form':{const n=Number(f.dataset.month),m=P.months[n-1];if(!m)break;const data=new FormData(f),checks=m.tasks.map((_,i)=>data.has(`task-${i}`)),evidence=val(f,'milestone-evidence'),reviewer=val(f,'milestone-reviewer'),status=val(f,'milestone-status');if(status!=='working'&&(!checks.every(Boolean)||!evidence))throw Error('請先完成三項勾選，並填寫成果或回饋。');if(status==='teacher'&&!reviewer)throw Error('老師確認需填老師／評閱者姓名。');plan().milestones[n]={checks,evidence,reviewer,status,at:today()};commit('已儲存你登錄的驗收狀態；不是自動能力認證。');E.render();break;}
 case 'plan-teacher-form':plan().teacher={name:val(f,'teacher-name'),contact:val(f,'teacher-contact'),mode:val(f,'teacher-mode'),notes:val(f,'teacher-notes')};commit('老師資料已存於本機；尚未對外預約或傳送。');break;
 case 'plan-log-form':{const date=val(f,'log-date'),kind=val(f,'log-kind'),minutes=Number(val(f,'log-minutes')),title=val(f,'log-title'),raw=val(f,'log-url'),url=M.safeURL(raw);requireDate(date,false);if(!kinds[kind]||!Number.isInteger(minutes)||minutes<1||minutes>480||!title)throw Error('請填主題及 1–480 分鐘的整數。');if(raw&&!url)throw Error('來源連結只接受不含帳密的 http 或 https 網址。');if(!f.dataset.id&&plan().logs.length>=2500)throw Error('已達 2,500 筆紀錄上限，請先備份後整理。');const record={id:f.dataset.id||M.uid(),date,kind,minutes,title,url,words:val(f,'log-words'),notes:val(f,'log-notes')};const idx=plan().logs.findIndex(x=>x.id===record.id);if(idx<0)plan().logs.push(record);else plan().logs[idx]=record;journalKind=kind;editLog='';commit('已記錄實際學習時間。');E.render();break;}
 case 'plan-visit-create':{const company=val(f,'visit-company'),date=val(f,'visit-date'),industry=val(f,'visit-industry');requireDate(date);if(!company||!P.ten[industry])throw Error('請填公司名稱並選擇產業。');if(plan().visits.length>=120)throw Error('已達 120 張訪客卡上限，請先備份後整理。');const v={id:M.uid(),company,date,industry,purpose:val(f,'visit-purpose'),lines:P.ten[industry].map(([pt,zh])=>({pt,zh,practiced:false})),unknown:'',correction:'',next:''};plan().visits.push(v);selectedVisit=v.id;commit('已建立十句範本，請依實際需求修改。');E.render();break;}
 case 'plan-visit-edit':{const v=plan().visits.find(x=>x.id===f.dataset.id);if(!v)break;if(!v.company.trim())throw Error('請填公司或情境名稱。');requireDate(v.date);commit('訪客十句與檢討筆記已儲存。');E.render();break;}
 case 'plan-work-create':{const type=val(f,'work-template'),t=P.templates.find(x=>x.id===type);if(!t)break;if(plan().works.length>=120)throw Error('已達 120 件作品上限，請先備份後整理。');const w={id:M.uid(),type,title:val(f,'work-title')||t.name,text:t.text,revised:'',notes:'',reviewer:'',status:'draft',updated:today(),reps:0};plan().works.push(w);selectedWork=w.id;commit('已建立可編輯範本，並非自動 AI 校稿。');E.render();break;}
 case 'plan-work-edit':{const w=plan().works.find(x=>x.id===f.dataset.id);if(!w)break;const status=val(f,'work-status');if(!w.title.trim())throw Error('請填作品名稱。');if(status==='revised'&&(!w.revised.trim()||!w.reviewer.trim()))throw Error('老師修訂狀態需填入修訂稿與評閱者。');if(status==='rehearsed'&&w.reps<1)throw Error('請實際演練後，先登錄一次演練。');w.status=status;w.updated=today();commit('作品與自行登錄的狀態已儲存。');E.render();break;}
 }
 }catch(error){E.toast(error.message||'資料未能儲存，請檢查內容。');}}
function input(event){const el=event.target,f=el.closest('form');if(!f)return;
 if(f.id==='plan-visit-edit'){const v=plan().visits.find(x=>x.id===f.dataset.id);if(!v)return;const part=el.dataset.visitPart,i=Number(el.dataset.visitIndex);if(['pt','zh','practiced'].includes(part)&&Number.isInteger(i)&&i>=0&&i<10)v.lines[i][part]=part==='practiced'?el.checked:el.value.slice(0,800);else if(['company','date','purpose','unknown','correction','next'].includes(el.dataset.visitField)){if(el.dataset.visitField==='date'&&!M.date(el.value))return;v[el.dataset.visitField]=el.value;}else return;commit();}
 else if(f.id==='plan-work-edit'){const w=plan().works.find(x=>x.id===f.dataset.id),key=el.dataset.workField;if(!w||!['title','text','revised','notes','reviewer'].includes(key))return;w[key]=el.value;w.updated=today();if(['text','revised','reviewer'].includes(key)&&w.status==='revised')w.status='review';if(key==='text'){const x=$('#work-count');if(x)x.textContent=`原稿約 ${wordCount(w.text)} 詞`;}commit();}
 else if(f.id==='plan-milestone-form'){const n=Number(f.dataset.month),m=P.months[n-1];if(!m)return;const data=new FormData(f),r=plan().milestones[n]||{status:'working',at:''};if(el.dataset.milestoneNote||el.hasAttribute('data-task')){r.checks=m.tasks.map((_,i)=>data.has(`task-${i}`));r.evidence=String(data.get('milestone-evidence')||'');r.reviewer=String(data.get('milestone-reviewer')||'');if(!r.checks.every(Boolean)||!r.evidence.trim()||(r.status==='teacher'&&!r.reviewer.trim())){r.status='working';const select=$('#milestone-status');if(select)select.value='working';}plan().milestones[n]=r;commit();}}
}
async function action(b){const a=b.dataset.action,id=b.dataset.id;try{switch(a){
 case 'plan-tab':E.go('plan/'+b.dataset.tab);break;
 case 'plan-month':selectedMonth=Math.min(18,Math.max(1,Number(b.dataset.month)||1));E.render();break;

 case 'plan-visit-slow':{const v=plan().visits.find(x=>x.id===id),i=Number(b.dataset.index);if(v?.lines[i])await E.speak(v.lines[i].pt,true);break;}
 case 'plan-visit-all':case 'plan-visit-shadow':{const v=plan().visits.find(x=>x.id===id);if(v)await E.speakPlaylist(v.lines.map(x=>x.pt),{rate:a==='plan-visit-shadow'?.75:E.getState().profile.speechRate,repeat:E.getState().profile.speechRepeat,gap:a==='plan-visit-shadow'?E.getState().profile.speechGap*1000:500,label:'訪客十句 · '+v.company});break;}
 case 'plan-visit-speak':{const v=plan().visits.find(x=>x.id===id),i=Number(b.dataset.index);if(v?.lines[i])await E.speak(v.lines[i].pt);break;}
 case 'plan-visit-export':{const v=plan().visits.find(x=>x.id===id);if(!v)break;download(`Bora-Visit-${escapeFile(v.company)}-${v.date}.txt`,`Bora! 訪客十句\n公司／情境：${v.company}\n日期：${v.date}\n產業：${P.industries.find(x=>x.id===v.industry).name}\n會談重點：${v.purpose}\n\n${v.lines.map((x,i)=>`${i+1}. ${x.pt}\n   ${x.zh}\n   跟讀：${x.practiced?'已完成':'未登錄'}`).join('\n\n')}\n\n沒聽懂的內容\n${v.unknown}\n\n老師修正／較好的說法\n${v.correction}\n\n下次準備\n${v.next}\n\n語言練習資料，不代表園區條件或法律／稅務建議。`);break;}
 case 'plan-work-open':selectedWork=id;E.render();$('#plan-work-edit')?.scrollIntoView({block:'start'});break;

 case 'plan-work-speak':case 'plan-work-all':case 'plan-work-shadow':{const field=$('#work-read-version')?.value==='revised'?$('#work-revised'):$('#work-original');let text=field?.value||'';if(a==='plan-work-speak'){text='';for(const el of [$('#work-original'),$('#work-revised')].filter(Boolean)){if(el.selectionEnd>el.selectionStart){text=el.value.slice(el.selectionStart,el.selectionEnd);break;}}if(!text.trim()){E.toast('請先在原稿或修訂稿選取葡文，或使用「全文逐句發音」。');break;}}if(!text.trim()){E.toast('選定的稿件是空白，請先填入葡文。');break;}await E.speakPlaylist(text,{rate:a==='plan-work-shadow'?.75:E.getState().profile.speechRate,repeat:E.getState().profile.speechRepeat,gap:a==='plan-work-shadow'?E.getState().profile.speechGap*1000:500,label:a==='plan-work-speak'?'選取文字朗讀':$('#work-read-version')?.value==='revised'?'老師修訂稿朗讀':'葡文原稿朗讀'});break;}
 case 'plan-work-export':{const w=plan().works.find(x=>x.id===id);if(!w)break;download(`Bora-Work-${escapeFile(w.title)}.txt`,`${w.title}\n更新：${w.updated}\n狀態：${workStatuses[w.status]}\n評閱者：${w.reviewer||'尚未填寫'}\n自行登錄演練：${w.reps} 次\n\n原稿\n${w.text}\n\n老師修訂稿\n${w.revised||'尚未填入'}\n\n修改／查證筆記\n${w.notes}\n\n語言練習草稿；未核實內容與方括號須另行檢查。本 App 未寄信或發布。`);break;}
 }}catch(error){E.toast(error.message||'操作未能完成。');}}

function answerQuiz(value,draft=''){

}

function reviewPage(){
 if(!review){const due=dueCards(),fresh=PHRASES.filter(p=>!state.srs[p.id]);return `<section class="panel empty"><div>${icon('cards')}</div><span class="pill">${due.length} 張到期 · ${fresh.length} 張未加入</span><h2 class="mt16">${due.length?'今天，先把這幾句找回來。':'現在沒有到期卡片。'}</h2><p>${due.length?'先看中文，在心裡或大聲說出葡語，再翻卡核對。':'可以先練 10 張新卡，或到課程中學習句型。已學句型會自動加入明天的複習。'}</p><div class="row wrap" style="justify-content:center">${due.length?`<button class="btn" data-action="start-review" data-mode="due">複習到期卡片${icon('arrow')}</button>`:''}${fresh.length?`<button class="btn ${due.length?'secondary':''}" data-action="start-review" data-mode="new">練習 ${Math.min(10,fresh.length)} 張新卡</button>`:''}${Object.keys(state.srs).length?`<button class="btn outline" data-action="start-review" data-mode="practice">自由回想（不更動排程）</button>`:''}<button class="btn outline" data-action="cards-tab" data-tab="library">查看全部句型</button></div><div class="note mt24" style="max-width:620px;margin-left:auto;margin-right:auto">再來一次：10 分鐘後；有點難：1 天後；記住了／很熟悉：依卡片階段安排 1、3、7、14、30、60 天。熟悉度由你自行判斷。</div></section>`;}
 if(review.index>=review.ids.length)return `<section class="panel empty"><div>${icon('trophy')}</div><h2>這輪複習完成。</h2><p>你已回想 ${review.ids.length} 張卡片。${review.practice?'本輪是自由回想，沒有改變原先的複習日期。':'新的日期已依你的自評排入本機進度。'}</p><button class="btn" data-action="end-review">回到複習首頁</button></section>`;
 const p=phrase(review.ids[review.index]),s=state.srs[p.id]||{step:0};return `<div class="review-meta row between"><span>第 ${review.index+1} / ${review.ids.length} 張 · ${esc(lessonMap.get(p.lesson).title)}</span><button class="text-btn" data-action="end-review">結束這輪</button></div><section class="review-card"><div class="row between" style="width:100%">${pill(p.level)}${bookmark(p.id)}</div>${review.revealed?`<p class="kicker mt16">ANSWER · 試著再說一次</p><h2 class="phrase-large pt" lang="pt-BR">${esc(p.pt)}</h2><p class="phrase-zh">${esc(p.zh)}</p>${spanish(p.es)}<div class="mt16">${speakBtn(p.pt)} ${speakBtn(p.pt,true)}</div><p class="small muted mt16">${esc(p.note)}</p>`:`<p class="kicker mt24">怎麼用葡語說？</p><h2 class="review-front">${esc(p.zh)}</h2><button class="btn secondary" data-action="reveal-card">${icon('eye')}翻開答案</button><p class="tiny muted mt12">電腦可按空白鍵翻卡</p>`}</section>${review.revealed?`<div class="review-controls">${[['again','再來一次','10 分鐘後','danger'],['hard','有點難','1 天後','outline'],['good','記住了',reviewDays(s.step,'good')+' 天後','secondary'],['easy','很熟悉',reviewDays(s.step,'easy')+' 天後','']].map(([v,t,sub,cls],i)=>`<button class="btn ${cls}" data-action="rate-card" data-value="${v}">${t}<small>${review.practice?'不更動排程':sub} · 按 ${i+1}</small></button>`).join('')}</div>`:''}`;
}
const INTERVALS=[1,3,7,14,30,60];
function reviewDays(step,rating){const next=clamp(step+(rating==='easy'?2:1),1,6);return INTERVALS[next-1];}
function startReview(mode){const list=mode==='due'?dueCards():mode==='practice'?shuffled(PHRASES.filter(p=>state.srs[p.id])).slice(0,10):PHRASES.filter(p=>!state.srs[p.id]).slice(0,10);if(!list.length){toast('目前沒有這一類卡片。');return;}review={ids:list.map(p=>p.id),index:0,revealed:false,practice:mode==='practice'};cardsTab='review';go('cards');}
function rateCard(rating){
 if(!review||!review.revealed||review.index>=review.ids.length||!['again','hard','good','easy'].includes(rating))return;
 const id=review.ids[review.index],s=state.srs[id]||{step:0,reps:0,lapses:0,due:Date.now()};
 if(review.practice){today().reviews++;award('review:'+id,3);review.index++;review.revealed=false;save();render();return;}
 if(rating==='again'){s.step=0;s.due=Date.now()+600000;s.lapses++;}else if(rating==='hard'){s.step=Math.max(0,s.step-1);s.due=Date.now()+DAY;}else{s.due=Date.now()+reviewDays(s.step,rating)*DAY;s.step=clamp(s.step+(rating==='easy'?2:1),1,6);if(!state.learned[id])state.learned[id]=Date.now();}
 s.reps++;state.srs[id]=s;today().reviews++;award('review:'+id,3);review.index++;review.revealed=false;save();render();
}
function libraryPage(){return `<div class="filters">${[['all','全部句型'],['favorite',`已收藏 ${state.favorites.length}`],['learned','已學習'],['wrong',`錯題 ${state.mistakes.length}`]].map(([v,t])=>`<button class="chip ${libraryFilter.type===v?'active':''}" data-action="library-type" data-value="${v}">${t}</button>`).join('')}<label class="search-box">${icon('search')}<input type="search" id="library-search" aria-label="搜尋句型" placeholder="搜尋葡語、中文或西文" value="${esc(libraryFilter.query)}"></label></div><div class="library-grid" id="library-grid">${libraryCards()}</div>`;}
function libraryCards(){const list=PHRASES.filter(p=>(libraryFilter.type==='all'||libraryFilter.type==='favorite'&&state.favorites.includes(p.id)||libraryFilter.type==='learned'&&state.learned[p.id]||libraryFilter.type==='wrong'&&state.mistakes.includes(p.id))&&matchQuery(p.pt+' '+p.zh+' '+p.es,libraryFilter.query));return list.length?list.map(p=>`<article class="panel phrase-card"><div class="row between"><div class="row gap8">${pill(p.level)}<span class="tiny muted">${esc(lessonMap.get(p.lesson).tag)}</span></div>${bookmark(p.id)}</div><h3 class="pt" lang="pt-BR">${esc(p.pt)}</h3><p class="zh">${esc(p.zh)}</p>${spanish(p.es)}<div class="row wrap mt16">${speakBtn(p.pt)}<button class="btn outline small" data-action="practice-phrase" data-id="${p.id}">${icon('mic')}跟讀</button></div>${state.srs[p.id]?`<p class="tiny muted mt12">下次複習：${state.srs[p.id].due<=Date.now()?'現在':new Date(state.srs[p.id].due).toLocaleDateString('zh-TW')}</p>`:''}</article>`).join(''):`<section class="panel empty"><h2>這裡還沒有句型</h2><p>可切換回全部句型，或在課程中按星星收藏。</p></section>`;}
function speakPage(){return heading('先聽一句，再說一句。','巴西葡語示範、跟讀錄音、情境回應。這一版不提供 AI 對話或發音評分。')+`<div class="tabbar">${[['pronunciation','發音播放器'],['shadow','跟讀與錄音'],['dialogs','情境會話'],['sounds','發音重點']].map(([v,t])=>`<button class="tab ${speakTab===v?'active':''}" data-action="speak-tab" data-tab="${v}">${t}</button>`).join('')}</div>${speakTab==='pronunciation'?pronunciationPage():speakTab==='shadow'?shadowPage():speakTab==='sounds'?soundsPage():dialogsPage()}`;}
function shadowPage(){const p=phrase(speakId)||PHRASES[0];return `<div class="quiz-wrap"><section class="panel"><div class="form-field"><label for="speak-phrase">選一句今天要說的話</label><select id="speak-phrase">${LESSONS.map(l=>`<optgroup label="${esc(l.level+' · '+l.title)}">${lphrases(l.id).map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${esc(x.pt)}</option>`).join('')}</optgroup>`).join('')}</select></div><div class="speech-stage"><span class="pill">${p.level} · ${esc(lessonMap.get(p.lesson).tag)}</span><h2 class="phrase-large pt" lang="pt-BR">${esc(p.pt)}</h2><p class="phrase-zh">${esc(p.zh)}</p>${spanish(p.es)}<div class="speech-controls">${speakBtn(p.pt)}${speakBtn(p.pt,true)}<button class="btn record-btn ${rec.recorder?.state==='recording'?'recording':''}" id="record-button" data-action="record">${icon(rec.recorder?.state==='recording'?'stop':'mic')}${rec.recorder?.state==='recording'?'停止錄音':'錄下我的聲音'}</button></div><div class="record-status" id="record-status" role="status">${rec.pending?'正在等候麥克風權限…':'每段最長 45 秒；按下錄音才要求麥克風權限。'}</div><div class="tiny muted voice-status"></div></div><div id="record-result" class="audio-result"></div><div class="note mt16">錄音只保留在本次頁面記憶體，不會由 App 上傳。切換頁面或重新錄音會清除前一段；可以先下載錄音。可用裝置 pt-BR 語音或巴葡神經合成音；線上語音另需同意。</div><h3 class="mt24">回聽後，自己檢查三件事</h3><ul class="checklist"><li>詞和詞之間，是否接得自然？</li><li>重要單字是否清楚，而不是搶快？</li><li>再聽一次示範，找一個可以修正的小地方。</li></ul><button class="btn secondary" data-action="mark-speaking" data-id="${p.id}">${icon('check')}${today().spoken.includes(p.id)?'今日已完成這句自我檢核':'我已跟讀並完成自我檢核'}</button><p class="tiny muted mt12">此按鈕記錄你的自評完成；不會自動判斷有沒有出聲，也不產生發音分數。</p></section></div>`;}
function soundsPage(){return `<div class="note">巴西有多種口音。以下是入門提醒，不把某一種發音當作全巴西唯一標準；可選 pt-BR 系統語音或巴葡神經合成音；合成示範不能取代老師對口型、地方口音與自然韻律的指導。</div><div class="sounds-grid">${C.sounds.map(s=>`<article class="panel sound-card"><h3>${esc(s.title)}</h3><div class="pt" lang="pt-BR">${esc(s.sample)}</div><p>${esc(s.note)}</p><div class="mt16">${speakBtn(s.sample)} ${speakBtn(s.sample,true)}</div></article>`).join('')}</div><div class="note mt24"><span class="voice-status"></span> 前往「偏好與備份」可選擇可用語音。</div>`;}
function dialogsPage(){
 if(!dialog)return `<div class="note mb16">腳本情境練習：讀／聽對方說的話，再選擇符合任務的回答。這不是自由聊天，也沒有連接 AI 服務。</div><div class="dialog-grid">${C.dialogs.map(d=>`<article class="panel dialog-card"><div class="row between"><div class="lesson-icon">${icon(d.icon)}</div>${pill(d.level)}</div><h3>${esc(d.title)}</h3><p>${esc(d.context)}</p><button class="btn ${state.dialogsDone.includes(d.id)?'secondary':''} small" data-action="start-dialog" data-id="${d.id}">${state.dialogsDone.includes(d.id)?'再練一次':'開始對話'}${icon('arrow')}</button></article>`).join('')}</div>`;
 const d=C.dialogs.find(x=>x.id===dialog.id);
 if(dialog.index>=d.steps.length)return `<div class="quiz-wrap"><section class="panel empty"><div>${icon('chat')}</div><h2>你完成了一段對話。</h2><p>${esc(d.context)}<br>已完成 ${d.steps.length} 個回應任務。這是腳本情境練習，不代表真實口語能力評估。</p><button class="btn" data-action="end-dialog">回到情境列表</button></section></div>`;
 const q=d.steps[dialog.index];return `<div class="quiz-wrap"><section class="panel"><div class="row between"><div><h2>${esc(d.title)}</h2><p class="small muted">角色：${esc(d.role)} · 第 ${dialog.index+1}/${d.steps.length} 輪</p></div><button class="text-btn" data-action="end-dialog">離開</button></div><div class="chat-log">${d.steps.slice(0,dialog.index+1).map((s,i)=>`<div class="bubble"><small>${esc(d.role)}</small><div class="pt" lang="pt-BR">${esc(s.pt)}</div><p class="zh">${esc(s.zh)}</p>${spanish(s.es)}<button class="text-btn" data-action="speak" data-text="${esc(s.pt)}">${icon('volume')}聽這句</button></div>${i<dialog.index?`<div class="bubble me"><small>你的回應</small><div class="pt" lang="pt-BR">${esc(s.options[s.answer])}</div></div>`:''}`).join('')}</div><h3 class="mb16">選擇最符合這個任務的回應</h3><div class="options">${q.options.map((t,i)=>`<button class="option ${dialog.selected===i?(i===q.answer?'correct':'wrong'):''}" data-action="dialog-answer" data-value="${i}" ${dialog.correct?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span lang="pt-BR">${esc(t)}</span></button>`).join('')}</div>${dialog.selected!==null?`<div class="feedback ${dialog.correct?'':'error'}" role="status"><strong>${dialog.correct?'這個回應符合任務。':'這句不符合目前任務，請再選一次。'}</strong>${dialog.correct?`<p class="mt8">${esc(q.note)}</p><div class="mt12">${speakBtn(q.options[q.answer])}</div><button class="btn small" data-action="dialog-next">${dialog.index===d.steps.length-1?'完成對話':'繼續對話'}${icon('arrow')}</button>`:''}</div>`:''}</section></div>`;
}
function grammarPage(){return heading('看懂句子的規則。','用熟悉的西語做對照，但不把兩種語言直接套在一起。')+`<div class="tabbar"><button class="tab ${grammarTab==='grammar'?'active':''}" data-action="grammar-tab" data-tab="grammar">文法重點 · 8</button><button class="tab ${grammarTab==='traps'?'active':''}" data-action="grammar-tab" data-tab="traps">葡西易混字 · 8</button></div>${grammarTab==='traps'?`<section class="panel"><h2 class="mb16">長得很像，不代表意思一樣。</h2><div class="table-scroll"><table class="traps-table"><thead><tr><th>巴西葡語</th><th>中文意思</th><th>西語對照</th><th>容易混淆的地方</th></tr></thead><tbody>${C.traps.map(t=>`<tr><td><span lang="pt-BR">${esc(t[0])}</span><br><button class="text-btn" data-action="speak" data-text="${esc(t[0])}">${icon('volume')}聽發音</button></td><td>${esc(t[1])}</td><td lang="es">${esc(t[2])}</td><td>${esc(t[3])}</td></tr>`).join('')}</tbody></table></div></section>`:`<div class="grammar-grid">${C.grammar.map(g=>grammarCard(g)).join('')}</div>`}`;}
function grammarCard(g){const a=grammarAnswer[g.id],has=a!==undefined,correct=a===g.answer;return `<article class="panel grammar-card" id="grammar-${g.id}"><div class="row between">${pill(g.level)}<span class="tiny muted">${state.grammarDone.includes(g.id)?'✓ 已答對檢核':''}</span></div><h3>${esc(g.title)}</h3><p>${esc(g.summary)}</p><div class="grammar-examples">${g.examples.map(x=>`<div class="grammar-example"><div class="pt" lang="pt-BR">${esc(x[0])}</div><div class="zh">${esc(x[1])}</div>${spanish(x[2])}<button class="text-btn" data-action="speak" data-text="${esc(x[0])}">${icon('volume')}聽例句</button></div>`).join('')}</div><h4 class="small mb16">${esc(g.question)}</h4><div class="options">${g.options.map((t,i)=>`<button class="option ${has&&i===a?(correct?'correct':'wrong'):''}" data-action="grammar-answer" data-id="${g.id}" data-value="${i}" ${correct?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span lang="pt-BR">${esc(t)}</span></button>`).join('')}</div>${has?`<div class="feedback ${correct?'':'error'}" role="status"><strong>${correct?'答對了。':'再想一下。'}</strong> ${esc(g.explain)}</div>`:''}</article>`;}
function progressPage(){const learned=Object.keys(state.learned).length,totalSeconds=Object.values(state.days).reduce((s,d)=>s+d.seconds,0),hist=state.history.slice(-10).reverse(),last7=Array.from({length:7},(_,i)=>{const k=dayOffset(i-6);return {key:k,min:Math.floor((state.days[k]?.seconds||0)/60)};}),max=Math.max(state.profile.dailyMinutes,...last7.map(d=>d.min),1);return heading('每一次練習，都算數。','以下皆來自本機的實際操作紀錄；未以示範數據填入成績。')+`<div class="stats-strip">${statCard('flame',streak(),'天','連續學習')}${statCard('clock',Math.floor(totalSeconds/60),'分鐘','累計有效練習時間')}${statCard('spark',totalXP(),'XP','練習累積點數')}</div><div class="progress-grid"><section class="panel chart-panel"><div class="row between"><h3>最近 7 天的練習</h3><span class="tiny muted">分鐘 · 本機時區</span></div><div class="week-chart" role="img" aria-label="${last7.map(d=>d.key+'：'+d.min+'分鐘').join('；')}">${last7.map((d,i)=>`<div class="bar-col ${i===6?'today':''}"><span class="bar-value">${d.min}</span><div class="bar-track"><div class="bar" style="height:${d.min/max*100}%"></div></div><span class="bar-label">${i===6?'今天':d.key.slice(5).replace('-','/')}</span></div>`).join('')}</div><p class="tiny muted mt24">在練習頁面且近 60 秒內有操作才累計時間；切換背景不計時。這是活動時間估計，不是專注力測量。</p></section><section class="panel"><h3>教材覆蓋進度</h3>${['A1','A2','B1','B2'].map(l=>{const list=PHRASES.filter(p=>p.level===l),n=list.filter(p=>state.learned[p.id]).length;return `<div class="level-row"><div class="row between"><b>${l} ${l==='A1'?'生活短句':l==='A2'?'情境溝通':l==='B1'?'商務練習':'進階示範'}</b><small>${n}/${list.length} 句型</small></div>${progressLine(n,list.length)}</div>`;}).join('')}<p class="tiny muted">這是教材完成度，不是 CEFR 能力等級。</p></section></div><section class="panel mt24"><div class="row between mb16"><h2>練習里程碑</h2><span class="pill">${LESSONS.filter(l=>completeLesson(l.id)).length}/16 課程完成</span></div><div class="row wrap"><span class="pill neutral">${learned}/96 已學句型</span><span class="pill neutral">${state.grammarDone.length}/8 文法檢核</span><span class="pill neutral">${state.dialogsDone.length}/6 情境會話</span><span class="pill gold">${state.mistakes.length} 句待訂正</span></div><div class="row wrap mt16"><button class="btn secondary small" data-action="quiz-wrong">${icon('refresh')}練習錯題</button><button class="btn outline small" data-action="export">${icon('download')}備份進度</button></div></section><section class="panel mt24"><h2 class="mb16">最近測驗</h2>${hist.length?`<div class="table-scroll"><table class="traps-table"><thead><tr><th>日期</th><th>方式</th><th>本題組結果</th></tr></thead><tbody>${hist.map(h=>`<tr><td style="font-size:13px;font-weight:400">${new Date(h.at).toLocaleString('zh-TW')}</td><td>${{reading:'閱讀理解',listening:'聽力選義',dictation:'逐句聽寫'}[h.mode]}</td><td>${h.correct}/${h.total} · ${Math.round(h.correct/h.total*100)}%</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted small">尚未完成測驗。完成一課後，可以用 6 題小測驗檢查理解。</p>`}</section>`;}

function updateSpeechDock(s){

 if(!$('#speech-now'))dock.innerHTML=`<div class="speech-dock-top"><div class="speech-dock-copy"><div id="speech-meta" class="tiny muted"></div><p id="speech-now" class="pt" lang="pt-BR"></p><div id="speech-feedback" class="tiny muted" role="status" aria-live="polite"></div></div><button class="icon-btn" data-action="speech-close" aria-label="停止播放並關閉播放器">${icon('x')}</button></div><div class="speech-dock-actions"><div class="row gap8"><button class="icon-btn" data-action="speech-prev" aria-label="上一句">${icon('back')}</button><button id="speech-toggle" class="btn small" data-action="speech-toggle"></button><button class="icon-btn" data-action="speech-next" aria-label="下一句">${icon('arrow')}</button><button class="btn outline small" data-action="speech-repeat">${icon('refresh')}重播本句</button><button class="btn outline small" data-action="speech-restart">從頭播放</button></div><a id="speech-download" class="text-btn" download="Bora-pronunciation.mp3">${icon('download')}下載本句 MP3</a></div>`;
 const playing=['playing','waiting','loading'].includes(s.status);
 $('#speech-meta').textContent=`${s.label} · ${Math.min(s.index+1,s.total)} / ${s.total} 段 · ${s.rate} ×`;
 $('#speech-now').textContent=s.text;$('#speech-feedback').textContent=s.message;
 $('#speech-toggle').innerHTML=icon(playing?'pause':'play')+(playing?'暫停':'繼續');
 $('#speech-toggle').disabled=false;
 const retry=['blocked','ready','error'].includes(s.status);
 if(retry)$('#speech-toggle').innerHTML=icon('play')+'點此播放';
 let nativeWrap=$('#bora-native-wrap');
 if(!nativeWrap){
  nativeWrap=document.createElement('div');nativeWrap.id='bora-native-wrap';nativeWrap.className='bora-native-wrap';
  const hint=document.createElement('p');hint.textContent='沒有聲音？直接點下方 ▶；播放時調高手機媒體音量，並確認藍牙輸出。';

 const a=$('#speech-download');a.hidden=!s.canDownload;if(s.canDownload)a.href=s.download;else a.removeAttribute('href');

 dock.querySelector('[data-action="speech-next"]').disabled=s.index>=s.total-1;
}

   const button=$('#record-button');if(button){button.disabled=false;button.classList.remove('recording');button.innerHTML=icon('mic')+'重新錄音';}

  rec.recorder.start();rec.started=Date.now();if(b){b.disabled=false;b.classList.add('recording');b.innerHTML=icon('stop')+'停止錄音';}
  const old=$('#record-result');if(old)old.innerHTML='';
  function tick(){if(token!==rec.token)return;const seconds=Math.floor((Date.now()-rec.started)/1000);const s=$('#record-status');if(s)s.textContent=`錄音中 ${seconds} / 45 秒 · 按停止即可回放`;if(seconds>=45)stopRecording();}
  tick();rec.timer=setInterval(tick,500);
 }catch(e){if(token!==rec.token)return;clearRecording();const button=$('#record-button');if(button)button.disabled=false;const st=$('#record-status');if(st)st.textContent='未啟用錄音。你仍可聽示範並自行跟讀。';toast(e.name==='NotAllowedError'?'麥克風未獲允許。請在瀏覽器權限設定中檢查。':e.name==='NotFoundError'?'沒有找到可用的麥克風。':'無法開始錄音，請檢查裝置及瀏覽器權限。');}
}
function showRecording(){const out=$('#record-result');if(!out||!rec.url)return;const ext=rec.mime.includes('mp4')?'m4a':rec.mime.includes('ogg')?'ogg':'webm';out.innerHTML=`<h3>回聽自己的聲音</h3><audio controls src="${rec.url}" aria-label="我的跟讀錄音"></audio><a class="btn outline small" href="${rec.url}" download="bora-${speakId}-${dateKey()}.${ext}">${icon('download')}下載這段錄音</a><button class="text-btn" data-action="delete-recording">刪除錄音</button>`;}
// ----- Export/import: strict schema; explicit replacement confirmation. -----
function downloadFile(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportProgress(){downloadFile(`bora-progress-${dateKey()}.json`,JSON.stringify({app:'bora-ptbr',version:VERSION,exportedAt:new Date().toISOString(),state},null,2));toast('已產生進度備份；請確認瀏覽器的下載項目。');}
async function importProgress(file){
 if(!file)return;if(file.size>32*1024*1024){toast('檔案過大，請選擇 Bora! 匯出的 JSON（最多 32 MB）。');return;}
 try{const parsed=JSON.parse(await file.text());if(parsed.app!=='bora-ptbr'||![1,VERSION].includes(parsed.version))throw new Error('不是 Bora! v1／v2 的備份檔。');const validated=validateState(parsed.state);if(!confirm(`將匯入「${validated.profile.name}」的進度，並覆蓋目前這個瀏覽器中的 Bora! 進度。請先確認已有舊進度備份。繼續嗎？`))return;clearRecording();stopSpeech();state=validated;storageLocked=false;storageMessage='';review=null;quiz=null;dialog=null;grammarAnswer={};save();render();toast('進度已匯入。');}catch(e){toast('匯入失敗：'+(e.message||'檔案格式無法識別。'));}
}
function updateSaveStatus(){const el=$('#save-status');if(el)el.innerHTML=`<i class="dot"></i>${storageOK&&!storageLocked?'本機儲存':'暫存模式'}`;}
async function installApp(){if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return;}toast(location.protocol==='file:'?'單檔模式不能安裝 PWA。請使用完整專案，以 localhost 或 HTTPS 開啟。':'請使用瀏覽器的「安裝應用程式」或「加入主畫面」。選項是否出現取決於裝置、瀏覽器及網站環境。');}
const board = window.BoraPlanUI.create({getState:()=>state,save,esc,icon,dateKey,heading,lessons:LESSONS,speakBtn,speak,speakPlaylist,downloadFile,toast,go,render});
document.addEventListener('submit',event=>board.submit(event));

// ----- UI events -----
document.addEventListener('click',async event=>{
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;lastInteraction=Date.now();const action=b.dataset.action,id=b.dataset.id,value=b.dataset.value;
 if(action.startsWith('plan-')){await board.action(b);return;}
 switch(action){
  case 'pron-open':clearRecording();stopSpeech();speakTab='pronunciation';go('speak');break;
  case 'pron-voices':loadVoices();toast(voiceStatus());break;
  case 'pron-test':{await speech.play('Oi, tudo bem?',{engine:'builtin',rate:1,label:'Dora 巴葡聲音試聽 · v2.2.0'});break;}
  case 'pron-repeat':await speakPlaylist([b.dataset.text],{rate:.75,repeat:3,gap:state.profile.speechGap*1000,label:'慢速跟讀 3 次'});break;
  case 'pron-lesson-play':case 'pron-lesson-shadow':await speakPlaylist(lphrases(id||pronLesson).map(p=>p.pt),{repeat:state.profile.speechRepeat,gap:action.endsWith('shadow')?state.profile.speechGap*1000:500,label:lessonMap.get(id||pronLesson)?.title||'課程逐句發音'});break;
  case 'pron-text-play':case 'pron-text-shadow':pronDraft=$('#pron-text')?.value||pronDraft;await speakPlaylist(pronDraft,{repeat:state.profile.speechRepeat,gap:action.endsWith('shadow')?state.profile.speechGap*1000:500,label:'自訂葡文 · 逐句朗讀'});break;
  case 'speech-close':stopSpeech();break;
  case 'speech-toggle':if(['playing','loading','waiting'].includes(speech.snapshot().status))speech.pause();else speech.resume();break;
  case 'speech-repeat':speech.replay();break;
  case 'speech-restart':speech.restart();break;
  case 'speech-prev':speech.next(-1);break;
  case 'speech-next':speech.next(1);break;

  case 'skip-main':event.preventDefault();$('#main')?.focus({preventScroll:true});$('#main')?.scrollIntoView({block:'start'});break;
  case 'go':go(b.dataset.route);break;
  case 'open-lesson':openLesson(id);break;
  case 'daily-next':{const d=today();if(d.practiced.length<6)openLesson(nextLesson().id);else if(d.reviews<5)startReview(dueCards().length?'due':PHRASES.some(p=>!state.srs[p.id])?'new':'practice');else if(!d.spoken.length){speakId=d.practiced[0]||PHRASES[0].id;speakTab='shadow';go('speak');}else go('courses');break;}
  case 'course-level':courseFilter.level=value;render();break;
  case 'course-track':courseFilter.track=value;render();break;
  case 'lesson-prev':stopSpeech();learning.index=Math.max(0,learning.index-1);render();break;
  case 'lesson-index':stopSpeech();learning.index=clamp(Number(value),0,5);render();break;
  case 'learn-next':stopSpeech();markLearned(id);if(learning.index===5)startQuiz('reading',learning.lesson);else{learning.index++;render();}break;
  case 'lesson-quiz':startQuiz('reading',id);break;
  case 'start-listening':startQuiz('listening',id);break;
  case 'favorite':if(!phrase(id))break;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();b.classList.toggle('active',state.favorites.includes(id));b.setAttribute('aria-pressed',String(state.favorites.includes(id)));b.setAttribute('aria-label',state.favorites.includes(id)?'取消收藏':'收藏句型');if(cardsTab==='library'&&section()==='cards'&&libraryFilter.type==='favorite')render();break;
  case 'speak':await speak(b.dataset.text,b.dataset.slow==='1');break;
  case 'practice-phrase':clearRecording();speakId=id;speakTab='shadow';go('speak');break;
  case 'quiz-setup':quiz=null;go('quiz/setup');break;
  case 'begin-quiz':startQuiz($('#quiz-mode').value,null,$('#quiz-pool').value);break;
  case 'quiz-answer':answerQuiz(Number(value));break;
  case 'dictation-check':answerQuiz(null,$('#dictation')?.value||'');break;
  case 'insert-char':{const t=$('#dictation');if(t&&!t.disabled){const start=t.selectionStart,end=t.selectionEnd;t.value=t.value.slice(0,start)+b.dataset.char+t.value.slice(end);t.focus();t.selectionStart=t.selectionEnd=start+1;quiz.draft=t.value;}break;}
  case 'quiz-next':if(!quiz?.answered)break;if(quiz.index===quiz.items.length-1)finishQuiz();else{quiz.index++;quiz.answered=false;quiz.selected=null;quiz.draft='';}stopSpeech();render();window.scrollTo(0,0);break;
  case 'quit-quiz':if(confirm('離開本次測驗？已答題的練習與錯題會保留，但未完成題組不計入測驗紀錄。')){const dest=quiz?.lessonId?'lesson/'+quiz.lessonId:'courses';quiz=null;go(dest);}break;
  case 'quiz-retry':if(quiz)startQuiz(quiz.mode,quiz.lessonId,quiz.pool);break;
  case 'quiz-to-reading':if(quiz){stopSpeech();startQuiz('reading',quiz.lessonId,quiz.pool);toast('已重新開始閱讀題組，不混用聽力或聽寫成績。');}break;
  case 'quiz-wrong':startQuiz('reading',null,'wrong');break;
  case 'cards-tab':cardsTab=b.dataset.tab;go('cards');break;
  case 'library-type':libraryFilter.type=value;render();break;
  case 'start-review':startReview(b.dataset.mode);break;
  case 'reveal-card':if(review){review.revealed=true;render();}break;
  case 'rate-card':rateCard(value);break;
  case 'end-review':review=null;render();break;
  case 'speak-tab':if(speakTab!==b.dataset.tab){clearRecording();stopSpeech();}speakTab=b.dataset.tab;go('speak');break;
  case 'record':await toggleRecording();break;
  case 'delete-recording':clearRecording();render();toast('本次錄音已刪除。');break;
  case 'mark-speaking':{const d=today();if(!d.spoken.includes(id))d.spoken.push(id);award('spoken:'+id,8);save();b.innerHTML=icon('check')+'今日已完成這句自我檢核';toast('已記錄你的自我檢核；不是自動發音評分。');break;}
  case 'start-dialog':dialog={id,index:0,selected:null,correct:false};render();break;
  case 'dialog-answer':{if(!dialog||dialog.correct)break;const d=C.dialogs.find(x=>x.id===dialog.id),q=d.steps[dialog.index];dialog.selected=Number(value);dialog.correct=dialog.selected===q.answer;render();break;}
  case 'dialog-next':if(dialog?.correct){const d=C.dialogs.find(x=>x.id===dialog.id);dialog.index++;dialog.selected=null;dialog.correct=false;if(dialog.index>=d.steps.length){if(!state.dialogsDone.includes(d.id))state.dialogsDone.push(d.id);award('dialog:'+d.id,15);save();}stopSpeech();render();window.scrollTo(0,0);}break;
  case 'end-dialog':dialog=null;stopSpeech();render();break;
  case 'grammar-tab':grammarTab=b.dataset.tab;go('grammar');break;
  case 'grammar-answer':{const g=C.grammar.find(x=>x.id===id);if(!g)break;grammarAnswer[id]=Number(value);if(Number(value)===g.answer){if(!state.grammarDone.includes(id))state.grammarDone.push(id);award('grammar:'+id,8);save();}const target=$('#grammar-'+id);if(target)target.outerHTML=grammarCard(g);break;}
  case 'save-profile':state.profile.name=$('#profile-name').value.trim().slice(0,32)||'學習者';state.profile.dailyMinutes=Number($('#daily-minutes').value);state.profile.spanish=$('#show-spanish').checked;state.profile.large=$('#large-text').checked;save();render();toast('學習偏好已儲存。');break;
  case 'save-voice':stopSpeech();state.profile.speechEngine=$('#voice-engine').value;state.profile.voice=$('#voice-select').value;state.profile.localOnly=$('#local-only').checked;remoteVoiceAllowed=false;speech.revokeConsent();save();updateVoiceUI();toast('語音設定已儲存。');break;
  case 'export':exportProgress();break;
  case 'export-raw':downloadFile(`bora-original-${dateKey()}.json`,rawSaved||'');break;
  case 'import':$('#import-file').click();break;
  case 'install':await installApp();break;
  case 'reset':if(prompt('請先備份。輸入 RESET 才會清除這個瀏覽器中的 Bora! v2 學習進度與計畫（v1 舊資料不刪除）。')==='RESET'){clearRecording();stopSpeech();state=defaults();review=null;quiz=null;dialog=null;grammarAnswer={};storageLocked=false;storageMessage='';rawSaved=null;try{localStorage.removeItem(KEY);}catch(e){}save();render();toast('已重設 Bora! 本機學習進度。');}break;
 }
});
document.addEventListener('input',event=>{board.input(event);lastInteraction=Date.now();const el=event.target;if(el.id==='pron-text')pronDraft=el.value;else if(el.id==='course-search'){courseFilter.query=el.value;$('#course-grid').innerHTML=courseCards();}else if(el.id==='library-search'){libraryFilter.query=el.value;$('#library-grid').innerHTML=libraryCards();}else if(el.id==='dictation'&&quiz)quiz.draft=el.value;});
document.addEventListener('change',async event=>{const el=event.target;
 if(el.id==='pron-lesson'){stopSpeech();pronLesson=el.value;render();}
 else if(el.id==='voice-engine'){state.profile.speechEngine=el.value;save();stopSpeech();loadVoices();}
 else if(['pron-rate','pron-repeat-count','pron-gap'].includes(el.id)){const key={'pron-rate':'speechRate','pron-repeat-count':'speechRepeat','pron-gap':'speechGap'}[el.id];state.profile[key]=Number(el.value);save();stopSpeech();}
 else if(el.id==='speak-phrase'){clearRecording();stopSpeech();speakId=el.value;render();}else if(el.id==='import-file'){await importProgress(el.files?.[0]);el.value='';}});
document.addEventListener('keydown',event=>{lastInteraction=Date.now();if(['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(event.target.tagName)||event.ctrlKey||event.metaKey||event.altKey)return;if(section()==='cards'&&cardsTab==='review'&&review&&review.index<review.ids.length){if(event.code==='Space'&&!review.revealed){event.preventDefault();review.revealed=true;render();}else if(review.revealed&&['1','2','3','4'].includes(event.key)){event.preventDefault();rateCard(['again','hard','good','easy'][Number(event.key)-1]);}}});
document.addEventListener('pointerdown',()=>lastInteraction=Date.now(),{passive:true});
document.addEventListener('scroll',()=>lastInteraction=Date.now(),{passive:true});
window.addEventListener('hashchange',()=>{lastTick=Date.now();clearRecording();stopSpeech();render();window.scrollTo(0,0);$('#main')?.focus({preventScroll:true});});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRecording();stopSpeech();}lastTick=Date.now();save();});
window.addEventListener('pagehide',()=>{clearRecording();stopSpeech();save();});
// Cap each tick and suspend idle/background tracking; dates use device local calendar.
setInterval(()=>{const now=Date.now(),elapsed=Math.min(15,Math.floor((now-lastTick)/1000));lastTick=now;const root=route.split('/')[0];if(!document.hidden&&now-lastInteraction<60000&&['lesson','cards','speak','grammar','quiz'].includes(root)&&elapsed>0){today().seconds=Math.min(86400,today().seconds+elapsed);save();}},15000);
if('speechSynthesis' in window){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
render();
// Enabled only when the full project contains sw.js. The portable build removes this block.

})();

</script>
