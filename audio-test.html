<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bora! 手機聲音測試 v2.1.1</title><style>body{font:18px/1.8 system-ui,"Microsoft JhengHei",sans-serif;background:#f5f8f0;color:#20372f;margin:0;padding:24px}main{max-width:640px;margin:auto;background:white;border:1px solid #d7e2d5;padding:25px;border-radius:18px}h1{font-size:26px}audio{width:100%;margin:15px 0}a{color:#17694f}p{overflow-wrap:anywhere}</style></head><body><main><h1>手機聲音測試 · v2.1.1</h1><p>請直接點下方播放器的 <strong>▶</strong>，應聽到「Oi, tudo bem?」。這頁不需要系統葡語語音，也不需要 JavaScript。</p><audio controls preload="metadata" src="./audio-sample.mp3" aria-label="播放巴西葡語測試句"></audio><p><a href="./audio-sample.mp3">直接開啟 MP3 測試</a></p><p>播放時按音量增加鍵，確認調整的是媒體音量，並檢查聲音是否送到藍牙耳機或車機。</p><p>測試有聲音：回到 App 按「測試手機聲音」，固定教材選「自動」或「內建音檔」。測試也沒聲音：改用手機完整瀏覽器，例如 Safari 或 Chrome，而非聊天附件預覽器。</p><p><a href="./?audiofix=2.1.1#home">返回新版 Bora! 練習</a></p><p style="font-size:13px">eSpeak pt-BR 基礎合成音，非真人錄音。此頁不讀取或修改學習紀錄。</p></main></body></html>
