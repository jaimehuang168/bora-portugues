name: Generate Brazilian natural audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/generate_natural_audio.py
      - .github/workflows/generate-natural-audio.yml
permissions:
  contents: write
concurrency:
  group: bora-natural-audio-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install synthesis and codec tools
        run: |
          python -m pip install 'edge-tts==7.2.8'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate normal and slow files, fail closed on errors
        run: python -u tools/generate_natural_audio.py
      - name: Commit only the verified public audio pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/natural-v1 audio/natural-manifest.json audio/natural-generation-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add 222 Brazilian neural phrases in normal and slow versions'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: bora-natural-audio
          path: audio/
          retention-days: 7
