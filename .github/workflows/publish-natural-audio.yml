# Historical one-shot writer. Current releases must not patch live HTML back to v2.1–v2.3.
name: Legacy base release — verify only
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify current and historical media without changing a branch
        run: |
          node tools/build_audio_catalog.mjs --verify-audio
          node tools/check_entry_assets.mjs
