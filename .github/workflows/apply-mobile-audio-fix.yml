name: Apply reviewed mobile audio fix
on:
  push:
    branches: [main]
    paths:
      - tools/fix_mobile_audio.py
      - .github/workflows/apply-mobile-audio-fix.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-mobile-audio-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'jaimehuang168/bora-portugues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply deterministic patch and validate JavaScript
        run: python3 tools/fix_mobile_audio.py
      - name: Commit only reviewed static outputs
        run: |
          set -euo pipefail
          git add -- index.html audio-test.html audio-sample.mp3 audio-fix-report.json
          if git diff --cached --quiet; then
            echo 'No changes to apply.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix mobile audio playback and add native diagnostic player (v2.1.1)'
          git push origin HEAD:main
