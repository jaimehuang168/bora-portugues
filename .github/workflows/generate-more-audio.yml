name: Generate new life travel business audio
on:
  push:
    branches: [main]
    paths:
      - assets/more-content.js
      - tools/list_more_audio.mjs
      - tools/generate_more_audio.py
      - .github/workflows/generate-more-audio.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bora-more-audio
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'jaimehuang168/bora-portugues'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local synthesis and codecs
        run: |
          python -m pip install 'kokoro-onnx==0.6.1' soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
      - name: Generate and validate all teaching audio
        run: python -u tools/generate_more_audio.py
      - name: Publish validated audio only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/more-audio.js audio/more-v1 audio/more-manifest.json more-audio-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add normal and slow audio for new life travel business lessons'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        with:
          name: bora-more-audio-report
          path: |
            audio/more-manifest.json
            more-audio-report.json
          retention-days: 7
          if-no-files-found: error
