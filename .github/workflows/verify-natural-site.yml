name: Verify published pronunciation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Check live Pages content, curriculum and audio
        env:
          VERIFY_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = 'https://jaimehuang168.github.io/bora-portugues/'
          release = Path('conversation-release-report.json')
          quality = json.loads((release if release.exists() else Path('audio-quality-report.json')).read_text())
          files = quality.get('files', {'index.html': quality['index_sha256']})
          def get(path):
              request = urllib.request.Request(base + path + '?verify=' + os.environ['VERIFY_RUN'], headers={'User-Agent': 'Bora-Deployment-Check/2.3'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError('HTTP ' + str(response.status))
                  return response.read()
          for attempt in range(16):
              try:
                  for path, expected in files.items():
                      body = get(path)
                      if hashlib.sha256(body).hexdigest() != expected:
                          raise ValueError('Pages serves a different revision: ' + path)
                  break
              except Exception as error:
                  print('Pages check:', str(error), flush=True)
                  if attempt == 15:
                      raise
                  time.sleep(15)
          assert ('v' + quality['version']) in get('index.html').decode()
          selected = []
          for name in ['audio/natural-manifest.json', 'audio/conversation-manifest.json']:
              if Path(name).exists():
                  manifest = json.loads(Path(name).read_text())
                  selected.extend(list(manifest['clips'].values())[::35])
          for item in selected:
              for path_key, hash_key in [('src', 'sha256'), ('slowSrc', 'slowSha256')]:
                  assert hashlib.sha256(get(item[path_key])).hexdigest() == item[hash_key], item[path_key]
          for path in ['audio-sample.mp3', 'audio-sample-slow.mp3', 'audio-test.html']:
              assert hashlib.sha256(get(path)).digest() == hashlib.sha256(Path(path).read_bytes()).digest(), path
          report = {'version': quality['version'], 'site': base, 'verified_index_sha256': quality['index_sha256'], 'application_assets_verified': list(files), 'public_neural_files_checked': len(selected)*2, 'sample_files_and_test_page_match': True, 'limits': 'HTTP byte verification, not a physical-phone listening test.'}
          Path('live-verification.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False), flush=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: bora-live-verification
          path: live-verification.json
          retention-days: 14
