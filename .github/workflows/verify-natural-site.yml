name: Verify published pronunciation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'audio-test.html', 'assets/**', 'audio/**', 'tools/**', '.github/workflows/**', 'README.md']
  pull_request:
    paths: ['index.html', 'audio-test.html', 'assets/**', 'audio/**', 'tools/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify curricula, state/privacy tests, entry integrity and all MP3 digests
        run: |
          node tools/test_release.mjs
          node tools/test_audio_promotion.mjs
          node tools/test_c1.mjs
          node tools/test_more_content.mjs
          python3 tools/test_model_assets.py
      - name: Check the public release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 tools/verify_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: bora-live-verification
          path: live-verification.json
          if-no-files-found: error
          retention-days: 14
