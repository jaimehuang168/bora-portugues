name: Generate conversation learning audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/generate_conversation_audio.py
      - tools/conversation_content*.b64
      - .github/workflows/generate-conversation-audio.yml
permissions:
  contents: write
concurrency:
  group: bora-conversation-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install public model and codec runtime
        run: |
          python -m pip install 'kokoro-onnx==0.6.1' soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
      - name: Validate curriculum and synthesize original public text
        run: python -u tools/generate_conversation_audio.py
      - name: Commit only validated curriculum and audio, not the live entry page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/conversation-content.json assets/conversation-content.js assets/conversation-audio.js audio/conversation-v1 audio/conversation-manifest.json conversation-generation-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add 18 grammar explanations, 36 examples, 54 keywords and Dora audio pairs'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        with:
          name: bora-conversation-material
          path: |
            assets/conversation-content.json
            assets/conversation-content.js
            assets/conversation-audio.js
            audio/conversation-v1
            audio/conversation-manifest.json
            conversation-generation-report.json
          retention-days: 7
          if-no-files-found: error
