name: C1 case audio
on:
  push:
    branches: [main]
    paths:
      - assets/c1-content.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    if: github.repository == 'jaimehuang168/bora-portugues' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Maximum for the isolated publisher; synthesis overrides to read-only.
    uses: ./.github/workflows/audio-pipeline.yml
    with:
      pack: c1
